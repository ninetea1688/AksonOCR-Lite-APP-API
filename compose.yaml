name: aksonocr-lite

services:
  ocr:
    build:
      context: .
      dockerfile: Dockerfile
    image: aksonocr-lite-api:local
    init: true
    restart: unless-stopped
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      OCR_DEVICE: cpu
      OCR_DEWARP: ${OCR_DEWARP:-false}
      OCR_TABLES: ${OCR_TABLES:-true}
      OCR_MAX_UPLOAD_MB: ${OCR_MAX_UPLOAD_MB:-20}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-10}
      OCR_MAX_PIXELS: ${OCR_MAX_PIXELS:-25000000}
      AKSONOCR_THREADS: ${AKSONOCR_THREADS:-2}
      HF_HOME: /cache/huggingface
    volumes:
      - model-cache:/cache/huggingface
    cpus: ${OCR_CPUS:-2.0}
    mem_limit: ${OCR_MEMORY_LIMIT:-4g}
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model-cache:
